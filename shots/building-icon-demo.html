<!doctype html>
<html lang="zh-CN" data-ui-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>建筑图标布局 Demo · 渊海天壳</title>
  <link rel="stylesheet" href="../css/main.css?v=147">
  <style>
    /* 复用巢穴页的 .wrap、.card、.tabs、.bzone、.row、.tag、.btn 样式。
       仅为 demo 建筑行加图标位，不改游戏页面样式。 */
    #pane-village-demo { padding:16px 18px; }
    #pane-village-demo .bzone { margin-top:17px; }
    #pane-village-demo .bzone:first-of-type { margin-top:2px; }
    #pane-village-demo .bzone .row {
      display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px;
      background:rgba(19,48,73,.28); border:1px solid rgba(104,164,196,.13);
      border-radius:10px; padding:11px 12px; margin-top:7px;
    }
    #pane-village-demo .row .nm { display:flex; align-items:center; gap:6px; flex-wrap:wrap; line-height:1.45; font-size:12px; }
    #pane-village-demo .row .ds { display:none; }
    #pane-village-demo .btn.buy { max-width:180px; min-height:30px; margin:0; padding:4px 8px; font-size:11px; white-space:normal; line-height:1.3; }
    #pane-village-demo .bld-copy { min-width:0; }
    #pane-village-demo .with-icon > div:first-child { display:grid; grid-template-columns:32px minmax(0,1fr); align-items:center; gap:8px; }
    #pane-village-demo .building-icon { display:block; width:32px; height:32px; object-fit:contain; border-radius:6px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.26)); }
    #pane-village-demo.icons-off .with-icon > div:first-child { grid-template-columns:minmax(0,1fr); }
    #pane-village-demo.icons-off .building-icon { display:none; }
    #pane-village-demo .cardhd .btn.tog { margin-left:auto; padding:2px 8px; font-size:10px; letter-spacing:0; }
    .demo-note { margin:0 0 10px; padding:8px 10px; border:1px solid rgba(105,226,223,.18); border-radius:8px; color:var(--dim); font-size:11px; }
    .demo-label { margin-left:5px; color:#75dce6; font-size:9px; letter-spacing:.5px; }
    @media(max-width:600px) {
      #pane-village-demo .bzone .row { grid-template-columns:minmax(0,1fr); gap:8px; }
      #pane-village-demo .bzone .row .btn.buy { justify-self:stretch; width:100%; max-width:none; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere-scene scene-a"></div>
    <div class="atmosphere-scene scene-b"></div>
    <div class="atmosphere-vignette"></div>
  </div>
  <main class="wrap">
    <header class="brandline">
      <div class="brandmark" aria-hidden="true"></div>
      <div>
        <h1>渊海天壳 <small>SHELLBREAK · 原始时代 → 破冰重置</small></h1>
        <div class="sub">自渊海，至天壳</div>
      </div>
      <div class="theme-switch" aria-hidden="true"><button>☀ 日间</button><button aria-pressed="true">☾ 夜间</button></div>
    </header>

    <section class="overview-grid" aria-label="资源与自然环境">
      <div class="card">
        <div class="cardhd" style="--hc:#4dd8e6"><span class="cv">▾</span>资源</div>
        <div class="grid">
          <div class="res"><b>12.4k</b><span>藻食　+18/s</span></div>
          <div class="res"><b>840</b><span>珊瑚　+2.1/s</span></div>
          <div class="res"><b>315</b><span>科技　+4/s</span></div>
          <div class="res"><b>72</b><span>钛金板件</span></div>
        </div>
      </div>
      <div class="card">
        <div class="cardhd" style="--hc:#a78bfa"><span class="cv">▾</span>自然环境</div>
        <div class="shellbar"><span>天壳 · 冰封层厚度</span><span>42%</span></div>
        <div class="shellwrap"><div class="shellfill" style="width:42%"></div></div>
        <div class="note">寒流季 · 海底火山活跃</div>
      </div>
    </section>

    <nav class="tabs" aria-label="游戏页面">
      <div class="tab on">巢穴</div><div class="tab">族民</div><div class="tab">科技</div>
      <div class="tab">市政</div><div class="tab">信仰</div><div class="tab">工坊</div><div class="tab">奇观</div>
    </nav>

    <section class="card" id="pane-village-demo">
      <div class="cardhd" style="--hc:#6fe0ae"><span class="cv">▾</span>巢穴
        <button type="button" class="btn tog on" id="icon-toggle" aria-pressed="true">图标显示中</button>
      </div>
      <div class="row"><div><div class="nm">手动采集</div><div class="ds">开局采集资源，建造第一座建筑。</div></div>
        <button class="btn buy">采藻食 +1</button><button class="btn buy">采珊瑚 +0.1</button></div>
      <p class="demo-note">建筑列表沿用游戏当前的分区、卡片、名称、等级标签和建造按钮样式。下方仅给“科研所”加图，图标和文字共用一行。</p>

      <div class="bzone">
        <div class="bztitle" style="--hc:#6fcf97"><span class="bzcv">▾</span>生息区</div>
        <div class="bzbody">
          <div class="row"><div><div class="nm"><button class="building-name">深海菌圃</button><span class="tag">12</span></div><div class="ds">提供稳定的藻食。</div></div><button class="btn buy">升级　珊瑚 1.2k</button></div>
        </div>
      </div>

      <div class="bzone">
        <div class="bztitle" style="--hc:#7fb8e6"><span class="bzcv">▾</span>学术区</div>
        <div class="bzbody">
          <div class="row"><div><div class="nm"><button class="building-name">天壳观测站</button><span class="tag">3</span></div><div class="ds">观测天壳，提升科技产出。</div></div><button class="btn buy">升级　钢 46</button></div>
          <div class="row with-icon"><div>
            <img class="building-icon" src="../assets/building-icons/era-6/researchlab-demo.png" alt="科研所图标">
            <div class="bld-copy"><div class="nm"><button class="building-name">科研所</button><span class="tag">1</span><span class="demo-label">ERA 6 图标示例</span></div>
              <div class="ds">每级科技产出 +10%；研究科技消耗 −2%。</div></div>
          </div><button class="btn buy">升级　钛金板件 200</button></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var pane = document.getElementById('pane-village-demo');
      var toggle = document.getElementById('icon-toggle');
      toggle.addEventListener('click', function (event) {
        event.stopPropagation();
        var shown = toggle.getAttribute('aria-pressed') !== 'true';
        toggle.setAttribute('aria-pressed', String(shown));
        toggle.classList.toggle('on', shown);
        toggle.textContent = shown ? '图标显示中' : '图标已隐藏';
        pane.classList.toggle('icons-off', !shown);
      });
    }());
  </script>
</body>
</html>
