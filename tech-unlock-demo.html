<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>科技页解锁 · 弹窗 Demo</title>
  <script>
    try {
      var savedUiTheme = localStorage.getItem('shellbreak.uiTheme');
      if (savedUiTheme === 'day' || savedUiTheme === 'night') {
        document.documentElement.dataset.uiTheme = savedUiTheme;
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/main.css?v=134">
  <style>
    body.demo-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
    .demo-toolbar{position:fixed;top:18px;left:50%;z-index:2;display:flex;align-items:center;gap:8px;transform:translateX(-50%);padding:5px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 86%,transparent);box-shadow:0 8px 30px rgba(0,0,0,.16)}
    .demo-toolbar span{padding:0 6px;color:var(--dim);font-size:11px;white-space:nowrap}
    .demo-toolbar button{padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--dim);font:inherit;font-size:11px;cursor:pointer}
    .demo-toolbar button.on{border-color:var(--cyan);background:var(--panel2);color:var(--txt)}
    .demo-modal{position:static!important;inset:auto!important;min-height:540px;width:min(100%,900px);background:transparent!important;backdrop-filter:none!important}
    .demo-modal .story-box{margin:auto}
    @media(max-width:600px){body.demo-page{padding:0}.demo-toolbar{top:10px}.demo-modal{min-height:100vh}}
  </style>
</head>
<body class="demo-page">
  <div class="demo-toolbar" aria-label="Demo 控制">
    <span>科技页解锁 · Demo</span>
    <button type="button" data-theme="day">☀ 日间</button>
    <button type="button" data-theme="night">☾ 夜间</button>
    <button type="button" id="replay">↻ 重播</button>
  </div>

  <div class="modal story-modal demo-modal" id="demoModal">
    <div class="box story-box">
      <div class="story-kicker"><span class="story-kicker-icon" aria-hidden="true">⌘</span><span>新系统解锁</span><i aria-hidden="true"></i></div>
      <div class="story-hero"><div class="story-hero-icon" aria-hidden="true">⌘</div><div class="story-hero-copy"><h3>科技页解锁</h3><span class="story-state">已开启</span></div></div>
      <div class="story-rule" aria-hidden="true"></div>
      <div class="story">
        <p>鲛人将细小坚韧的深海藻类打了个结，「这代表今天，」他说。</p>
        <p>随后，他又打了第二个结，「这代表明天。」</p>
      </div>
      <div class="story-unlock"><span class="story-unlock-mark" aria-hidden="true">✓</span><div><strong>科技树已开放</strong><small>现在可以研究科技，并查看每项科技的尤里卡条件。</small></div></div>
      <div class="foot story-actions"><button class="big" type="button" id="enterTech">进入科技页<span aria-hidden="true">→</span></button></div>
    </div>
  </div>

  <script>
    function syncTheme(theme){
      document.documentElement.dataset.uiTheme = theme;
      document.querySelectorAll('[data-theme]').forEach(function (button) {
        button.classList.toggle('on', button.dataset.theme === theme);
      });
    }
    document.querySelectorAll('[data-theme]').forEach(function (button) {
      button.addEventListener('click', function () { syncTheme(button.dataset.theme); });
    });
    document.getElementById('replay').addEventListener('click', function () {
      var card = document.querySelector('.story-box');
      card.classList.remove('story-replay');
      void card.offsetWidth;
      card.classList.add('story-replay');
    });
    document.getElementById('enterTech').addEventListener('click', function () {
      this.textContent = '科技页已进入 ✓';
    });
    syncTheme(document.documentElement.dataset.uiTheme === 'day' ? 'day' : 'night');
  </script>
</body>
</html>
